<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="neonBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#dc2626" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- AI Eye / Brain in background under pressure -->
  <circle cx="32" cy="32" r="16" fill="url(#eyeGlow)"/>
  <circle cx="32" cy="32" r="6" fill="#ef4444" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="2.5" fill="#ffffff"/>

  <!-- Vertical Prison Bars with Neon Cyan/Blue Accent -->
  <!-- Outer Bar Left -->
  <rect x="12" y="10" width="4.5" height="44" rx="2.2" fill="url(#neonBar)"/>
  <!-- Middle Left Bar -->
  <rect x="25" y="8" width="4.5" height="48" rx="2.2" fill="url(#neonBar)" filter="url(#glow)"/>
  <!-- Middle Right Bar -->
  <rect x="35" y="8" width="4.5" height="48" rx="2.2" fill="url(#neonBar)" filter="url(#glow)"/>
  <!-- Outer Bar Right -->
  <rect x="48" y="10" width="4.5" height="44" rx="2.2" fill="url(#neonBar)"/>

  <!-- Cross Beam / Interrogation Framing -->
  <path d="M8 20H56M8 44H56" stroke="#475569" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Red warning accent light top corner -->
  <circle cx="53" cy="11" r="3" fill="#ef4444" filter="url(#glow)"/>
</svg>
